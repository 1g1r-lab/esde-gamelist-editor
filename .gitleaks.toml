# gitleaks configuration for esde-gamelist-editor
# Extends the built-in ruleset with rules that guard against leaking personal
# machine details (private IPs, UNC shares, NAS mounts, user-home paths).
title = "1G1R Lab — esde-gamelist-editor"

[extend]
useDefault = true

[[rules]]
id = "private-ipv4"
description = "Private / RFC1918 IPv4 address"
regex = '''\b(?:10\.(?:\d{1,3}\.){2}\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''
tags = ["network", "personal"]

[[rules]]
id = "unc-path"
description = "Windows UNC network share path"
regex = '''\\\\[A-Za-z0-9._-]+\\[A-Za-z0-9._$-]+'''
tags = ["path", "personal"]

[[rules]]
id = "nas-mount-path"
description = "NAS / Unix mount path that may reveal host layout"
# NOTE: "/media/<x>/" is intentionally NOT matched here — this is an ES-DE media
# editor, so "downloaded_media/<system>/..." style paths are normal, not leaks.
# /home/<user>/ (user-home-path), UNC and private-IP rules still apply.
regex = '''(?:/volume\d+/|/mnt/[A-Za-z0-9._-]+/|smb://|nfs://)'''
tags = ["path", "personal"]

[[rules]]
id = "user-home-path"
description = "Absolute user-home path that may reveal a username"
regex = '''(?:/home/[A-Za-z0-9._-]+/|/Users/[A-Za-z0-9._-]+/|C:\\Users\\[A-Za-z0-9._-]+\\)'''
tags = ["path", "personal"]

[allowlist]
description = "Files that legitimately contain the patterns above"
paths = [
  '''\.gitleaks\.toml''',
]
