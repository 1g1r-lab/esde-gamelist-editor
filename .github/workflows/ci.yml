name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    name: UI tests (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test

  python:
    name: Python compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile all modules
        run: python -m compileall -q api.py app.py gamelist.py fileops.py

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          version=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --no-banner

  ci-ok:
    name: CI OK
    if: always()
    needs: [ui-tests, python, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to pass
        run: |
          if [ "${{ needs.ui-tests.result }}" != "success" ] \
             || [ "${{ needs.python.result }}" != "success" ] \
             || [ "${{ needs.gitleaks.result }}" != "success" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
